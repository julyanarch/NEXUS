---
# NEXUS Dashboard - coleta best-effort do historico de comandos do usuario
# (~/.bash_history). Usado pelo botao "Coletar historico" na pagina de
# detalhe do usuario, alimenta a IA local (ai_engine.py).
#
# Limitacoes conhecidas (documentadas na UI, nao escondidas do operador):
#   - historico pode estar vazio, desativado (HISTSIZE=0) ou limpo (history -c);
#   - sessoes ainda abertas so gravam o arquivo ao fechar o shell;
#   - assume shell bash com home em /home/<usuario> (padrao do useradd usado
#     pelo nexus_sanitize_users.sh).
#
# extra-vars esperadas: target_host, target_username, host_vars_root

- name: NEXUS - Coletar historico de comandos (best-effort)
  hosts: "{{ target_host }}"
  gather_facts: no
  become: yes
  tasks:
    # host_vars_root fica fora de inventory/ e de playbooks/, entao o
    # Ansible nao o descobre sozinho - precisa ser carregado explicitamente
    # (senao "become" falha com "Missing sudo password" mesmo com a senha
    # ja configurada na tela "senha sudo").
    - name: Verificar se ha senha de sudo configurada para este servidor (controller)
      ansible.builtin.stat:
        path: "{{ host_vars_root }}/{{ inventory_hostname }}"
      delegate_to: localhost
      become: no
      register: host_vars_stat
      changed_when: false

    - name: Carregar senha de sudo do servidor (Ansible Vault, quando configurada)
      ansible.builtin.include_vars:
        dir: "{{ host_vars_root }}/{{ inventory_hostname }}"
      become: no
      when: host_vars_stat.stat.exists

    - name: Verificar se o arquivo de historico existe
      ansible.builtin.stat:
        path: "/home/{{ target_username }}/.bash_history"
      register: history_stat

    - name: Ler o arquivo de historico (quando existir)
      ansible.builtin.slurp:
        src: "/home/{{ target_username }}/.bash_history"
      register: history_slurp
      when: history_stat.stat.exists
