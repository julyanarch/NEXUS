[defaults]
inventory = ./inventory/hosts.yml
# vault_password_file NAO fica aqui de proposito: cada chamada (encrypt_string
# na tela "senha sudo", ou ANSIBLE_VAULT_PASSWORD_FILE nas execucoes) ja passa
# o caminho explicitamente. Declarar aqui tambem faz o ansible-vault ver duas
# fontes de senha e falhar com "vault-ids default,default are available".
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
# HostKeyAlgorithms=+ssh-rsa (o "+" ACRESCENTA ao padrao, nao substitui):
# hosts modernos continuam preferindo ed25519/ecdsa/rsa-sha2 normalmente.
# So entra em uso quando o servidor remoto e antigo e oferece apenas
# ssh-rsa/ssh-dss como host key (ex.: 10.1.255.100), caso em que o
# OpenSSH >= 8.8 do cliente recusa negociar por padrao com:
# "Unable to negotiate ... no matching host key type found".
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o HostKeyAlgorithms=+ssh-rsa
