<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS · Login</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <style>
    body.login-body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }

    /* grande e discreta ao fundo - mesma logo da sidebar (static/img/logo.svg) */
    .watermark {
      position: fixed;
      right: -8vw;
      bottom: -10vh;
      width: min(70vw, 820px);
      height: min(70vw, 820px);
      opacity: 0.07;
      pointer-events: none;
      z-index: 0;
    }
    .watermark img { width: 100%; height: 100%; }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      padding: 32px 28px 28px;
    }

    .login-brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 2px;
    }
    .login-brand-row img { width: 30px; height: 30px; flex-shrink: 0; }
    .login-brand-row .brand { font-size: 1.45rem; }

    .login-sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-bottom: 26px;
    }

    h1.login-title {
      margin: 0 0 20px;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      text-align: center;
    }

    .login-card .btn { display: block; width: 100%; margin-top: 18px; font-weight: 600; }

    .footnote {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.72rem;
      margin-top: 20px;
    }
  </style>
</head>
<body class="login-body">
  <div class="watermark" aria-hidden="true">
    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="">
  </div>

  <div class="login-card card">
    <div class="login-brand-row">
      <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="">
      <div class="brand">NEXUS<span>.</span></div>
    </div>
    <div class="login-sub">Gestão de Usuários</div>

    <h1 class="login-title">Entrar</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <label>Usuário</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn" type="submit">Entrar</button>
    </form>

    <div class="footnote">Acesso restrito · NEXUS &middot; Grupo Think</div>
  </div>
</body>
</html>
